;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Hardware is a Wemos D1 mini; the nodemcuv2 target uses the same ESP-12
; module, 4 MB flash layout and D-pin names. Kept so the existing EEPROM
; sector location doesn't move.
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 38400
upload_speed = 921600
board_build.f_cpu = 160000000L

; Versions pinned to the last known-good build
lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit ILI9341@1.6.3
  paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
